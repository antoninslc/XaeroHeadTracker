plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url "https://chocolateminecraft.com/maven"
		name "Xaero's Maven"
	}
}
loom {

	runs {
		client {
			programArgs "--quickPlaySingleplayer", "Test ${project.minecraft_version.replace('.', '_')}"
		}
	}
	splitEnvironmentSourceSets()

	mods {
		"xaeroheadtracker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	// Le mot-clé "modImplementation" est vital ici :
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "xaero.map:xaeroworldmap-fabric-1.21.1:${project.xaeroworldmap_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	archiveBaseName.set("XaeroHeadTracker")
	archiveClassifier.set("fabric-${project.minecraft_version}")
	archiveVersion.set(project.version)

	from("LICENSE") {
		rename { "${it}_XaeroHeadTracker"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Dev : cree le monde de test "Test <version>" depuis le modele dev/test-world s'il n'existe pas encore
tasks.register('prepareTestWorld') {
	def monde = file("run/saves/Test ${project.minecraft_version.replace('.', '_')}")
	def modele = file('dev/test-world')
	onlyIf { !monde.exists() && modele.exists() }
	doLast {
		copy {
			from modele
			into monde
		}
	}
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'prepareTestWorld' }

remapJar {
	archiveBaseName.set("XaeroHeadTracker")
	archiveClassifier.set("fabric-${project.minecraft_version}")
}
